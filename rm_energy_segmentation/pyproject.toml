[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rm-energy-segmentation"
version = "0.1.0"
description = "RoboMaster energy mechanism instance segmentation and module parameter estimation demo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "torch>=2.0",
    "torchvision>=0.15",
]

[tool.setuptools]
packages = ["rmvs"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

